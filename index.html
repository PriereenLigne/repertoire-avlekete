<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Répertoire Numérique de la Jeunesse – Avlékété</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark:#1a3d2b; --green-mid:#2d6a4f; --green-light:#52b788;
      --gold:#d4a843; --gold-light:#f0c060;
      --cream:#faf6ef; --cream-dark:#f0e8d8;
      --text-dark:#1a1a1a; --text-mid:#3d3d3d; --text-light:#6b7280;
      --white:#ffffff; --red:#c0392b; --blue:#1e6091;
      --shadow:0 4px 24px rgba(26,61,43,0.10);
      --shadow-lg:0 8px 40px rgba(26,61,43,0.16);
      --radius:12px; --radius-lg:20px;
    }
    html { scroll-behavior: smooth; }
    body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text-dark); min-height:100vh; }

    /* NAV */
    .nav { position:sticky; top:0; z-index:100; background:var(--green-dark); display:flex; align-items:center; justify-content:space-between; padding:0 2rem; height:64px; box-shadow:0 2px 12px rgba(0,0,0,0.18); }
    .nav-brand { display:flex; align-items:center; gap:12px; cursor:pointer; }
    .nav-logo { width:38px; height:38px; border-radius:8px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; color:var(--green-dark); font-size:18px; }
    .nav-title { color:var(--white); font-weight:600; font-size:15px; line-height:1.2; }
    .nav-sub { color:var(--green-light); font-size:12px; font-weight:300; }
    .nav-links { display:flex; gap:8px; align-items:center; }
    .nav-btn { padding:8px 18px; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; border:none; transition:all 0.2s; font-family:'DM Sans',sans-serif; }
    .nav-btn-ghost { background:transparent; color:var(--cream-dark); }
    .nav-btn-ghost:hover { background:rgba(255,255,255,0.08); color:white; }
    .nav-btn-gold { background:var(--gold); color:var(--green-dark); }
    .nav-btn-gold:hover { background:var(--gold-light); }
    .nav-user { display:flex; align-items:center; gap:10px; color:var(--white); font-size:14px; }
    .nav-avatar { width:34px; height:34px; border-radius:50%; background:var(--green-light); display:flex; align-items:center; justify-content:center; font-weight:600; color:var(--white); font-size:13px; cursor:pointer; }

    /* HERO */
    .hero { background:linear-gradient(135deg,var(--green-dark) 0%,var(--green-mid) 60%,#1a5c3a 100%); padding:80px 2rem 100px; text-align:center; position:relative; overflow:hidden; }
    .hero::before { content:''; position:absolute; inset:0; pointer-events:none; background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
    .hero-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(212,168,67,0.15); border:1px solid rgba(212,168,67,0.3); color:var(--gold-light); padding:6px 16px; border-radius:100px; font-size:13px; font-weight:500; margin-bottom:24px; }
    .hero h1 { font-family:'Playfair Display',serif; font-size:clamp(2rem,5vw,3.5rem); color:var(--white); line-height:1.15; margin-bottom:20px; }
    .hero h1 span { color:var(--gold-light); }
    .hero p { color:rgba(255,255,255,0.75); font-size:17px; max-width:580px; margin:0 auto 40px; line-height:1.7; font-weight:300; }
    .hero-btns { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
    .btn-primary { background:var(--gold); color:var(--green-dark); padding:14px 32px; border-radius:10px; font-size:15px; font-weight:600; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.2s; box-shadow:0 4px 16px rgba(212,168,67,0.35); }
    .btn-primary:hover { background:var(--gold-light); transform:translateY(-1px); }
    .btn-outline { background:transparent; color:var(--white); padding:14px 32px; border-radius:10px; font-size:15px; font-weight:500; border:2px solid rgba(255,255,255,0.3); cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
    .btn-outline:hover { border-color:white; background:rgba(255,255,255,0.08); }

    /* STATS */
    .stats-bar { background:var(--white); margin:-40px 2rem 0; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:28px 36px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:24px; position:relative; z-index:10; }
    .stat-item { text-align:center; }
    .stat-num { font-family:'Playfair Display',serif; font-size:2rem; color:var(--green-dark); font-weight:700; }
    .stat-lbl { font-size:13px; color:var(--text-light); margin-top:2px; }
    .stat-divider { width:1px; background:var(--cream-dark); }

    /* LAYOUT */
    .page { max-width:1200px; margin:0 auto; padding:0 1.5rem; }
    .section { padding:48px 0; }
    .section-title { font-family:'Playfair Display',serif; font-size:1.75rem; color:var(--green-dark); margin-bottom:8px; }
    .section-sub { color:var(--text-light); font-size:15px; margin-bottom:32px; }

    /* CARDS */
    .card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; border:1px solid rgba(0,0,0,0.04); }
    .card-title { font-weight:600; font-size:16px; margin-bottom:4px; color:var(--text-dark); }
    .card-sub { font-size:13px; color:var(--text-light); margin-bottom:20px; }

    /* GRID */
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
    @media(max-width:768px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }

    /* FORM */
    .form-section-title { font-size:13px; font-weight:600; color:var(--green-mid); text-transform:uppercase; letter-spacing:0.08em; padding:16px 0 10px; border-bottom:1px solid var(--cream-dark); margin-bottom:20px; }
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:13px; font-weight:500; color:var(--text-mid); margin-bottom:6px; }
    .form-label span { color:var(--red); margin-left:2px; }
    .form-input,.form-select,.form-textarea { width:100%; padding:11px 14px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:14px; font-family:'DM Sans',sans-serif; color:var(--text-dark); background:var(--white); transition:border-color 0.2s; outline:none; }
    .form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--green-light); box-shadow:0 0 0 3px rgba(82,183,136,0.1); }
    .form-input.error,.form-select.error { border-color:var(--red); }
    .form-error { font-size:12px; color:var(--red); margin-top:4px; }
    .form-textarea { resize:vertical; min-height:90px; }
    .form-hint { font-size:12px; color:var(--text-light); margin-top:4px; }

    /* UPLOAD */
    .upload-zone { border:2px dashed #d1d5db; border-radius:10px; padding:24px; text-align:center; cursor:pointer; transition:all 0.2s; background:var(--cream); }
    .upload-zone:hover { border-color:var(--green-light); background:rgba(82,183,136,0.04); }
    .upload-icon { font-size:28px; margin-bottom:8px; }
    .upload-text { font-size:14px; color:var(--text-mid); }
    .upload-sub { font-size:12px; color:var(--text-light); margin-top:4px; }
    .file-chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; background:rgba(82,183,136,0.1); border-radius:100px; font-size:13px; color:var(--green-mid); margin:4px; }
    .file-chip-x { cursor:pointer; color:var(--red); font-weight:700; }

    /* PROFILE CARD */
    .profile-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; border:1px solid rgba(0,0,0,0.04); transition:box-shadow 0.2s; }
    .profile-card:hover { box-shadow:var(--shadow-lg); }
    .profile-card-header { background:linear-gradient(135deg,var(--green-dark),var(--green-mid)); padding:20px; display:flex; align-items:center; gap:16px; }
    .profile-avatar { width:52px; height:52px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif; font-weight:700; color:var(--green-dark); font-size:20px; flex-shrink:0; border:3px solid rgba(255,255,255,0.2); }
    .profile-name { color:white; font-weight:600; font-size:15px; }
    .profile-village { color:rgba(255,255,255,0.65); font-size:13px; margin-top:2px; }
    .profile-body { padding:16px 20px; }
    .profile-badge { display:inline-flex; padding:4px 12px; border-radius:100px; font-size:12px; font-weight:500; margin-bottom:12px; }
    .badge-emploi { background:#d1fae5; color:#065f46; }
    .badge-chomage { background:#fee2e2; color:#991b1b; }
    .badge-stage { background:#dbeafe; color:#1e40af; }
    .badge-autre { background:#f3f4f6; color:#374151; }
    .profile-info { font-size:13px; color:var(--text-light); line-height:2; }
    .profile-info span { color:var(--text-dark); font-weight:500; }

    /* DASHBOARD */
    .dash-header { background:linear-gradient(135deg,var(--green-dark) 0%,var(--green-mid) 100%); padding:32px 2rem 48px; }
    .dash-title { font-family:'Playfair Display',serif; font-size:1.8rem; color:white; }
    .dash-sub { color:rgba(255,255,255,0.65); font-size:14px; margin-top:4px; }
    .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:16px; }
    .kpi-card { background:white; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border-left:4px solid var(--green-light); }
    .kpi-card.gold { border-left-color:var(--gold); }
    .kpi-card.blue { border-left-color:var(--blue); }
    .kpi-card.red  { border-left-color:var(--red); }
    .kpi-card.pink { border-left-color:#be185d; }
    .kpi-card.amber{ border-left-color:#f59e0b; }
    .kpi-icon { width:40px; height:40px; border-radius:10px; background:rgba(82,183,136,0.1); display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:12px; }
    .kpi-card.gold .kpi-icon { background:rgba(212,168,67,0.1); }
    .kpi-card.blue .kpi-icon { background:rgba(30,96,145,0.1); }
    .kpi-card.red  .kpi-icon { background:rgba(192,57,43,0.1); }
    .kpi-card.pink .kpi-icon { background:rgba(190,24,93,0.1); }
    .kpi-value { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; color:var(--green-dark); }
    .kpi-label { font-size:13px; color:var(--text-light); margin-top:2px; }
    .kpi-trend { font-size:12px; color:var(--green-light); font-weight:500; margin-top:8px; }

    /* TABLE */
    .table-wrap { overflow-x:auto; border-radius:var(--radius); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th { background:var(--cream-dark); color:var(--text-mid); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; padding:12px 16px; text-align:left; }
    td { padding:14px 16px; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--cream); }

    /* SEARCH */
    .search-bar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
    .search-input-wrap { position:relative; flex:1; min-width:240px; }
    .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-light); font-size:16px; }
    .search-input { width:100%; padding:10px 14px 10px 38px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:14px; font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.2s; }
    .search-input:focus { border-color:var(--green-light); }
    .filter-select { padding:10px 14px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:14px; font-family:'DM Sans',sans-serif; background:white; cursor:pointer; outline:none; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .btn-green { background:var(--green-mid); color:white; }
    .btn-green:hover:not(:disabled) { background:var(--green-dark); }
    .btn-gold { background:var(--gold); color:var(--green-dark); }
    .btn-gold:hover:not(:disabled) { background:var(--gold-light); }
    .btn-sm { padding:6px 14px; font-size:13px; }
    .btn-danger { background:#fee2e2; color:var(--red); }
    .btn-danger:hover { background:#fecaca; }
    .btn-ghost-green { background:rgba(45,106,79,0.08); color:var(--green-mid); border:1px solid rgba(45,106,79,0.15); }
    .btn-ghost-green:hover { background:rgba(45,106,79,0.15); }
    .btn-blue { background:var(--blue); color:white; }
    .btn-blue:hover { background:#155074; }
    .btn-whatsapp { background:#25d366; color:white; }
    .btn-whatsapp:hover { background:#1da851; }

    /* TABS */
    .tabs { display:flex; gap:4px; background:var(--cream-dark); padding:4px; border-radius:10px; width:fit-content; margin-bottom:24px; flex-wrap:wrap; }
    .tab { padding:8px 18px; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--text-light); font-family:'DM Sans',sans-serif; transition:all 0.2s; }
    .tab.active { background:white; color:var(--green-dark); box-shadow:var(--shadow); }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:1rem; backdrop-filter:blur(4px); }
    .modal { background:white; border-radius:var(--radius-lg); width:100%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
    .modal-header { padding:24px 28px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:white; z-index:1; border-bottom:1px solid var(--cream-dark); }
    .modal-title { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--green-dark); }
    .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-light); }
    .modal-body { padding:24px 28px 28px; }

    /* TOAST */
    .toast-container { position:fixed; bottom:24px; right:24px; z-index:300; display:flex; flex-direction:column; gap:10px; }
    .toast { background:var(--green-dark); color:white; padding:14px 20px; border-radius:10px; font-size:14px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:slideIn 0.3s ease; }
    .toast.error { background:var(--red); }
    .toast.success { background:#065f46; }
    @keyframes slideIn { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* MISC */
    .village-chip { display:inline-flex; align-items:center; gap:6px; background:rgba(26,61,43,0.08); color:var(--green-dark); padding:4px 12px; border-radius:100px; font-size:12px; font-weight:500; }
    .steps { display:flex; gap:0; margin-bottom:36px; }
    .step { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; cursor:pointer; }
    .step:hover .step-circle { box-shadow:0 0 0 4px rgba(82,183,136,0.18); }
    .step::after { content:''; position:absolute; top:18px; left:50%; width:100%; height:2px; background:var(--cream-dark); z-index:0; pointer-events:none; }
    .step:last-child::after { display:none; }
    .step-circle { width:36px; height:36px; border-radius:50%; background:var(--cream-dark); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:var(--text-light); position:relative; z-index:1; transition:all 0.3s; }
    .step.active .step-circle { background:var(--green-mid); color:white; }
    .step.done  .step-circle { background:var(--green-light); color:white; }
    .step-label { font-size:12px; color:var(--text-light); margin-top:6px; text-align:center; }
    .step.active .step-label { color:var(--green-mid); font-weight:600; }
    .chart-box { position:relative; height:240px; }
    .login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--green-dark) 0%,var(--green-mid) 100%); padding:1.5rem; }
    .login-card { background:white; border-radius:var(--radius-lg); padding:40px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
    .login-logo { text-align:center; margin-bottom:28px; }
    .login-logo-circle { width:64px; height:64px; border-radius:16px; background:var(--green-dark); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-family:'Playfair Display',serif; font-weight:700; color:var(--gold); font-size:28px; }
    .login-title { font-family:'Playfair Display',serif; font-size:1.4rem; color:var(--green-dark); text-align:center; }
    .login-sub { font-size:13px; color:var(--text-light); text-align:center; margin-top:4px; margin-bottom:28px; }
    .role-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:24px; }
    .role-tab { padding:12px; border-radius:8px; border:2px solid var(--cream-dark); text-align:center; cursor:pointer; transition:all 0.2s; font-size:13px; font-family:'DM Sans',sans-serif; font-weight:500; }
    .role-tab.active { border-color:var(--green-mid); background:rgba(45,106,79,0.06); color:var(--green-mid); }
    .role-tab-icon { font-size:22px; margin-bottom:4px; }
    .empty-state { text-align:center; padding:60px 20px; }
    .empty-icon { font-size:48px; margin-bottom:16px; }
    .empty-title { font-size:16px; font-weight:600; color:var(--text-dark); margin-bottom:8px; }
    .spinner { width:24px; height:24px; border:3px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; display:inline-block; }
    .spinner.dark { border-color:rgba(45,106,79,0.2); border-top-color:var(--green-mid); }
    @keyframes spin { to{transform:rotate(360deg)} }
    .chat-container { display:flex; flex-direction:column; height:420px; border:1.5px solid #e5e7eb; border-radius:12px; overflow:hidden; }
    .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; background:#f9fafb; }
    .chat-bubble { max-width:75%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; }
    .chat-bubble.sent { background:var(--green-mid); color:white; align-self:flex-end; border-bottom-right-radius:4px; }
    .chat-bubble.received { background:white; color:var(--text-dark); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
    .chat-bubble-meta { font-size:11px; opacity:.65; margin-top:4px; }
    .chat-input-row { display:flex; gap:8px; padding:12px; background:white; border-top:1px solid #e5e7eb; }
    .chat-input { flex:1; padding:10px 14px; border:1.5px solid #e5e7eb; border-radius:24px; font-size:14px; font-family:'DM Sans',sans-serif; outline:none; }
    .chat-input:focus { border-color:var(--green-light); }
    .notif-count { background:var(--red); color:white; font-size:10px; font-weight:700; border-radius:100px; padding:1px 6px; }
    .security-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:100px; font-size:12px; font-weight:600; }
    .security-admin { background:rgba(192,57,43,0.1); color:var(--red); border:1px solid rgba(192,57,43,0.2); }
    .activity-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #f3f4f6; }
    .activity-item:last-child { border-bottom:none; }
    .activity-dot { width:8px; height:8px; border-radius:50%; background:var(--green-light); margin-top:6px; flex-shrink:0; }
    .inbox-item { display:flex; align-items:center; gap:12px; padding:14px; border-radius:10px; cursor:pointer; transition:background 0.15s; }
    .inbox-item:hover { background:var(--cream); }
    .inbox-item.unread { background:rgba(82,183,136,0.06); }
    .admin-lock { background:linear-gradient(135deg,#7f1d1d,#991b1b); color:white; padding:12px 20px; border-radius:10px; font-size:14px; display:flex; align-items:center; gap:10px; margin-bottom:20px; }
    @media(max-width:640px){ .nav{padding:0 1rem;} .hero{padding:48px 1rem 80px;} .stats-bar{margin:-32px 1rem 0;padding:20px;} .stat-divider{display:none;} }
    ::-webkit-scrollbar{width:6px;height:6px;} ::-webkit-scrollbar-track{background:var(--cream);} ::-webkit-scrollbar-thumb{background:var(--green-light);border-radius:3px;}
  </style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ╔══════════════════════════════════════════════════════════════╗
// ║  ⚙️  CONFIGURATION  — Remplacez par vos vraies clés Supabase ║
// ╚══════════════════════════════════════════════════════════════╝
const SUPABASE_URL  = 'https://ztxgspevzkmxuqudjuap.supabase.co';
const SUPABASE_ANON = 'sb_publishable_8Yl2sExSzCLVtMHiAPVkHA_FvSYPyez';
// ── Fin configuration ──────────────────────────────────────────

const IS_CFG = !SUPABASE_URL.includes('VOTRE') && !SUPABASE_ANON.includes('VOTRE');
const db     = IS_CFG ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

/* ─── Admins hardcodés (jamais en base) ─── */
const ADMINS = [
  { id:'adm1', username:'admin',         password:'Admin@2025!Avl', nom:'Administrateur Principal', role:'admin', adminRole:'principal'   },
  { id:'adm2', username:'resp.avlekete', password:'Resp@Avl2025!',  nom:'Responsable Avlékété',     role:'admin', adminRole:'responsable' },
];

/* ─── Listes ─── */
const NIVEAUX    = ['Sans diplôme','Primaire','Collège (BEPC)','Lycée (BAC)','BTS / DUT','Licence','Master','Doctorat','Formation professionnelle'];
const SITUATIONS = ['Emploi salarié','Emploi indépendant','Chômage','Stage','Formation','Inactif'];
const PROFESSIONS= ['Agriculture / Élevage','Artisanat','BTP / Construction','Commerce / Vente','Éducation / Enseignement','Finance / Banque','Informatique / Tech','Médecine / Santé','Pêche / Aquaculture','Restauration / Hôtellerie','Transport / Logistique','Couture / Mode','Coiffure / Esthétique','Mécanique','Autre'];
const VILLAGES_DEF=['Adounko','Adounko Ayignon','Agbanzin-Kpota','Agbanzin-Kpota Zounvlamè','Agouin','Ahouandji-Avlékété','Avlékété','Hio','Hio Vinawa'];

/* ─── Utilitaires ─── */
async function hashPwd(p){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p+':avl2025!')); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function fileToB64(f){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);}); }
function fmtDate(s){ if(!s)return'—'; return new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}); }
function getAge(d){ if(!d)return'—'; return Math.floor((Date.now()-new Date(d))/(365.25*24*3600*1000)); }
function waLink(t){ return 'https://wa.me/229'+(t||'').replace(/\D/g,''); }
function badgeCls(s){ return({'Emploi salarié':'badge-emploi','Emploi indépendant':'badge-emploi','Chômage':'badge-chomage','Stage':'badge-stage','Formation':'badge-stage','Inactif':'badge-autre'})[s]||'badge-autre'; }

/* ─── Session (sessionStorage) ─── */
const sess={ get:()=>{try{const v=sessionStorage.getItem('avl_s');return v?JSON.parse(v):null;}catch{return null;}}, set:v=>{try{sessionStorage.setItem('avl_s',JSON.stringify(v));}catch{}}, del:()=>{try{sessionStorage.removeItem('avl_s');}catch{};} };

/* ─── Normalisation DB → React (snake_case → camelCase) ─── */
const nJ=j=>({...j,createdAt:(j.created_at||'').split('T')[0],files:j.files||[],role:'user'});
const nM=m=>({...m,toUserId:m.to_user_id,from:m.from_role,readByAdmin:m.read_by_admin,readByUser:m.read_by_user,at:m.created_at});

/* ─── API base de données ─── */
const DB={
  async jeunes(){ const{data,error}=await db.from('jeunes').select('*').order('created_at',{ascending:false}); if(error)throw error; return(data||[]).map(nJ); },
  async addJeune(j){ const{data,error}=await db.from('jeunes').insert(j).select().single(); if(error)throw error; return nJ(data); },
  async updJeune(id,u){ const{data,error}=await db.from('jeunes').update(u).eq('id',id).select().single(); if(error)throw error; return nJ(data); },
  async delJeune(id){ const{error}=await db.from('jeunes').delete().eq('id',id); if(error)throw error; },
  async account(cip){ const{data,error}=await db.from('accounts').select('*').eq('cip',cip).maybeSingle(); if(error)throw error; return data; },
  async addAccount(a){ const{error}=await db.from('accounts').insert(a); if(error)throw error; },
  async messages(){ const{data,error}=await db.from('messages').select('*').order('created_at'); if(error)throw error; return(data||[]).map(nM); },
  async addMsg(m){ const{data,error}=await db.from('messages').insert(m).select().single(); if(error)throw error; return nM(data); },
  async readMsgs(ids,f){ if(!ids.length)return; const{error}=await db.from('messages').update({[f]:true}).in('id',ids); if(error)throw error; },
  async adminByUsername(u){ const{data,error}=await db.from('admins').select('*').eq('username',u).maybeSingle(); if(error)throw error; return data; },
  async admins(){ const{data,error}=await db.from('admins').select('*').order('created_at'); if(error)throw error; return data||[]; },
  async addAdmin(a){ const{data,error}=await db.from('admins').insert(a).select().single(); if(error)throw error; return data; },
  async villages(){ const{data,error}=await db.from('villages').select('nom').order('nom'); if(error)throw error; return(data||[]).map(v=>v.nom); },
  async addVillage(n){ const{error}=await db.from('villages').insert({nom:n}); if(error)throw error; },
  async delVillage(n){ const{error}=await db.from('villages').delete().eq('nom',n); if(error)throw error; },
  async log(msg,type='info'){ try{ await db.from('activity_log').insert({msg,type}); }catch(e){ console.error('Log activité échoué :',e); } },
  async logs(){ const{data,error}=await db.from('activity_log').select('*').order('created_at',{ascending:false}).limit(100); if(error)throw error; return data||[]; },
};

/* ═══════════════════ ÉCRANS SYSTÈME ═══════════════════ */

    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#1a3d2b,#2d6a4f)',padding:'1.5rem'}}>
      <div style={{background:'white',borderRadius:20,padding:40,maxWidth:660,width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{width:64,height:64,borderRadius:16,background:'#1a3d2b',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 14px',fontSize:28,fontWeight:700,color:'#d4a843',fontFamily:'Playfair Display,serif'}}>A</div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.6rem',color:'#1a3d2b'}}>Configuration Supabase requise</div>
          <div style={{color:'#6b7280',fontSize:14,marginTop:6}}>Connectez votre base de données pour activer la plateforme</div>

        <div style={{background:'#f0fdf4',border:'1px solid #a7f3d0',borderRadius:12,padding:20,marginBottom:20}}>
          <div style={{fontWeight:700,color:'#065f46',marginBottom:14}}>📋 5 étapes · environ 5 minutes</div>
          {[
            ['1','Créez un projet gratuit sur ','supabase.com'],

              <span style={{fontSize:14,color:'#374151',lineHeight:1.5}}>{t}{l&&<a href={'https://'+l} target="_blank" rel="noopener noreferrer" style={{color:'#2d6a4f',fontWeight:700}}>{l}</a>}</span>

        </div>
        <div style={{background:'#f9fafb',borderRadius:10,padding:16,fontFamily:'monospace',fontSize:12.5}}>
          <div style={{color:'#6b7280',marginBottom:6,fontWeight:600,fontSize:11,textTransform:'uppercase',letterSpacing:'0.05em'}}>Lignes 24-25 de index.html :</div>
          <div style={{color:'#ef4444'}}>const SUPABASE_URL  = 'https://VOTRE_ID.supabase.co';</div>
          <div style={{color:'#ef4444',marginBottom:8}}>const SUPABASE_ANON = 'VOTRE_CLE_ANON_PUBLIQUE';</div>
          <div style={{color:'#059669'}}>const SUPABASE_URL  = 'https://abcxyz.supabase.co';  ← votre vraie URL</div>
          <div style={{color:'#059669'}}>const SUPABASE_ANON = 'eyJhbGciOiJIUzI...';           ← votre vraie clé</div>
        </div>
      </div>
    </div>
  );
}

function SplashScreen(){
  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#1a3d2b,#2d6a4f)'}}>
      <div style={{width:64,height:64,borderRadius:18,background:'rgba(255,255,255,0.1)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Playfair Display,serif',fontWeight:700,color:'#d4a843',fontSize:28,marginBottom:28}}>A</div>
      <div style={{width:36,height:36,border:'4px solid rgba(255,255,255,0.25)',borderTopColor:'white',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>
      <div style={{color:'rgba(255,255,255,0.7)',marginTop:18,fontSize:15}}>Chargement de la plateforme…</div>

}

function ErrorScreen({msg,onRetry}){
  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#fff7f7',padding:'2rem'}}>
      <div style={{maxWidth:520,textAlign:'center'}}>
        <div style={{fontSize:52,marginBottom:16}}>⚠️</div>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.4rem',color:'#c0392b',marginBottom:12}}>Erreur de connexion</div>

        </div>

function Toasts({list}){
  return(
    <div style={{position:'fixed',bottom:24,right:24,zIndex:300,display:'flex',flexDirection:'column',gap:10}}>
      {list.map(t=>(
        <div key={t.id} style={{background:t.type==='error'?'#c0392b':t.type==='success'?'#065f46':'#1a3d2b',color:'white',padding:'14px 20px',borderRadius:10,fontSize:14,boxShadow:'0 8px 32px rgba(0,0,0,0.2)',display:'flex',alignItems:'center',gap:10,animation:'slideIn 0.3s ease'}}>

}

/* ═══════════════════ ROOT WRAPPER ═══════════════════ */
/* Root vérifie la config avant de monter App (évite les hooks conditionnels) */
function Root(){
  if(!IS_CFG) return <SetupScreen/>;
  return <App/>;
}

/* ═══════════════════ APP PRINCIPAL ═══════════════════ */
function App(){
  /* Tous les hooks déclarés inconditionnellement en premier */
  const [ready,   setReady]    = useState(false);
  const [dbErr,   setDbErr]    = useState(null);
  const [session, setSession]  = useState(()=>sess.get());
  const [page,    setPage]     = useState('home');
  const [users,   setUsers]    = useState([]);
  const [villages,setVillages] = useState(VILLAGES_DEF);
  const [messages,setMessages] = useState([]);
  const [actLog,  setActLog]   = useState([]);
  const [dbAdmins,setDbAdmins] = useState([]);
  const [toasts,  setToasts]   = useState([]);

  /* Toast helper */
  const toast = useCallback((msg,type='success')=>{
    const id=Date.now();
    setToasts(ts=>[...ts,{id,msg,type}]);
    setTimeout(()=>setToasts(ts=>ts.filter(t=>t.id!==id)),4200);
  },[]);

  /* Chargement initial */
  const init = useCallback(async()=>{
    setDbErr(null); setReady(false);
    try{
      const[jArr,vArr,mArr]=await Promise.all([DB.jeunes(),DB.villages(),DB.messages()]);
      setUsers(jArr);
      setVillages(vArr.length?vArr:VILLAGES_DEF);
      setMessages(mArr);
      setReady(true);
    }catch(e){
      setDbErr(e.message||'Impossible de joindre la base de données.');
      setReady(true);
    }
  },[]);

  useEffect(()=>{init();},[]);

  /* Auth */
  const login = useCallback(async(identifier,password,role)=>{
    if(role==='admin'){
      const adm=ADMINS.find(a=>a.username===identifier&&a.password===password);
      if(adm){
        const s={role:'admin',username:adm.username,nom:adm.nom,adminRole:adm.adminRole,loggedAt:new Date().toISOString()};
        setSession(s);sess.set(s);
        DB.log(`Connexion admin : ${adm.nom}`,'admin');
        return true;
      }
      /* Comptes responsables créés depuis le tableau de bord par l'administrateur principal */
      try{
        const dbAdm=await DB.adminByUsername(identifier.trim());
        if(!dbAdm)return false;
        const hash=await hashPwd(password);
        if(hash!==dbAdm.password_hash)return false;
        const s={role:'admin',username:dbAdm.username,nom:dbAdm.nom,adminRole:dbAdm.role,adminId:dbAdm.id,loggedAt:new Date().toISOString()};
        setSession(s);sess.set(s);
        DB.log(`Connexion admin : ${dbAdm.nom}`,'admin');
        return true;
      }catch(e){console.error(e);return false;}
    }
    try{
      const acc=await DB.account(identifier.trim());
      if(!acc)return false;
      const hash=await hashPwd(password);
      if(hash!==acc.password_hash)return false;
      const u=users.find(u=>u.id===acc.user_id);
      if(!u||u.status==='rejected')return false;
      if(u.status==='pending')return 'pending';
      const s={role:'user',userId:u.id,cip:u.cip,nom:u.nom,prenom:u.prenom,loggedAt:new Date().toISOString()};
      setSession(s);sess.set(s);
      DB.log(`Connexion jeune : ${u.prenom} ${u.nom}`,'user');
      return true;
    }catch(e){console.error(e);return false;}
  },[users]);

  const logout = useCallback(()=>{sess.del();setSession(null);setPage('home');},[]);

  /* Mutations jeunes */
  const doSaveUser = useCallback(async(id,updates)=>{
    const updated=await DB.updJeune(id,updates);
    setUsers(prev=>prev.map(u=>u.id===id?updated:u));
    return updated;
  },[]);
  const doAddUser  = useCallback(u=>setUsers(prev=>[u,...prev]),[]);
  const doDelUser  = useCallback(async id=>{await DB.delJeune(id);setUsers(prev=>prev.filter(u=>u.id!==id));},[]);

  /* Mutations villages */
  const doAddVillage = useCallback(async nom=>{await DB.addVillage(nom);setVillages(prev=>[...prev,nom].sort());},[]);
  const doDelVillage = useCallback(async nom=>{await DB.delVillage(nom);setVillages(prev=>prev.filter(v=>v!==nom));},[]);

  /* Mutations messages */
  const doAddMsg = useCallback(async payload=>{
    const saved=await DB.addMsg(payload);
    setMessages(prev=>[...prev,saved]);
    return saved;
  },[]);
  const doReadMsgs = useCallback(async(ids,dbField)=>{
    if(!ids.length)return;
    await DB.readMsgs(ids,dbField);
    const jsField=dbField==='read_by_admin'?'readByAdmin':'readByUser';
    setMessages(prev=>prev.map(m=>ids.includes(m.id)?{...m,[jsField]:true}:m));
  },[]);

  /* Journal */
  const doLoadLogs = useCallback(async()=>{const logs=await DB.logs();setActLog(logs);},[]);

  /* Administrateurs responsables (créés par l'administrateur principal) */
  const doLoadAdmins = useCallback(async()=>{const list=await DB.admins();setDbAdmins(list);},[]);
  const doAddAdmin   = useCallback(async a=>{const saved=await DB.addAdmin(a);setDbAdmins(prev=>[...prev,saved]);return saved;},[]);

  /* Renders conditionnels APRÈS tous les hooks */
  if(!ready) return <SplashScreen/>;
  if(dbErr)  return <ErrorScreen msg={dbErr} onRetry={init}/>;

  /* Dérivés */
  const currentUser  = session?.role==='user'?users.find(u=>u.id===session.userId):null;
  const pendingCount = users.filter(u=>u.status==='pending').length;
  const unreadAdmin  = messages.filter(m=>!m.readByAdmin&&m.from==='user').length;
  const myUnread     = currentUser?messages.filter(m=>m.toUserId===currentUser.id&&!m.readByUser).length:0;

  /* Barre de navigation */
  function Nav(){
    return(
      <nav className="nav">
        <div className="nav-brand" onClick={()=>setPage('home')} style={{cursor:'pointer'}}>
          <div className="nav-logo">A</div>
          <div>
            <div className="nav-title">Répertoire d'Avlékété</div>
            <div className="nav-sub">Ouidah · Bénin</div>
          </div>
        </div>
        <div className="nav-links">
          {!session&&(
            <>
              <button className="nav-btn nav-btn-ghost" onClick={()=>setPage('login')}>Connexion</button>
              <button className="nav-btn nav-btn-gold"  onClick={()=>setPage('register')}>S'inscrire</button>
            </>
          )}
          {session?.role==='admin'&&(
            <>
              <button className="nav-btn nav-btn-ghost" onClick={()=>setPage('dashboard')}>
                Tableau de bord
                {(pendingCount+unreadAdmin)>0&&<span className="notif-count" style={{marginLeft:6}}>{pendingCount+unreadAdmin}</span>}
              </button>
              <div className="nav-user">
                <div className="nav-avatar" style={{background:'var(--red)'}}>🛡</div>
                <span style={{fontSize:13}}>{session.nom?.split(' ')[0]}</span>
                <button className="nav-btn nav-btn-ghost" onClick={logout} style={{fontSize:13}}>Déconnexion</button>
              </div>
            </>
          )}
          {session?.role==='user'&&(
            <>
              <button className="nav-btn nav-btn-ghost" onClick={()=>setPage('profile')}>Mon profil</button>
              <button className="nav-btn nav-btn-ghost" onClick={()=>setPage('mymessages')}>
                💬{myUnread>0&&<span className="notif-count" style={{marginLeft:4}}>{myUnread}</span>}
              </button>
              <div className="nav-user">
                <div className="nav-avatar">{currentUser?.prenom?.[0]}{currentUser?.nom?.[0]}</div>
                <button className="nav-btn nav-btn-ghost" onClick={logout} style={{fontSize:13}}>⎋</button>
              </div>
            </>
          )}
        </div>
      </nav>
    );
  }

  return(
    <div>
      <Nav/>
      {page==='home'       &&<HomePage setPage={setPage} session={session} users={users}/>}
      {page==='login'      &&<LoginPage login={login} setPage={setPage} toast={toast}/>}
      {page==='register'   &&<RegisterPage users={users} doAddUser={doAddUser} villages={villages} setPage={setPage} toast={toast}/>}
      {page==='profile'    &&session?.role==='user'&&currentUser&&
        <ProfilePage user={currentUser} doSaveUser={doSaveUser} villages={villages} setPage={setPage} toast={toast} messages={messages} doAddMsg={doAddMsg} doReadMsgs={doReadMsgs}/>}
      {page==='mymessages' &&session?.role==='user'&&currentUser&&
        <MyMessagesPage user={currentUser} messages={messages} doAddMsg={doAddMsg} doReadMsgs={doReadMsgs} toast={toast}/>}
      {page==='dashboard'  &&session?.role==='admin'&&
        <DashboardPage session={session} users={users} doSaveUser={doSaveUser} doDelUser={doDelUser} villages={villages} doAddVillage={doAddVillage} doDelVillage={doDelVillage} toast={toast} messages={messages} doAddMsg={doAddMsg} doReadMsgs={doReadMsgs} actLog={actLog} doLoadLogs={doLoadLogs} dbAdmins={dbAdmins} doLoadAdmins={doLoadAdmins} doAddAdmin={doAddAdmin}/>}
      {!session&&page==='dashboard'&&<LoginPage login={login} setPage={setPage} toast={toast} forceAdmin/>}
      <Toasts list={toasts}/>
    </div>
  );
}

/* ═══════════════════ HOME PAGE ═══════════════════ */
function HomePage({setPage,session,users}){
  const ok=users.filter(u=>u.status==='approved');
  return(
    <div>
      <div className="hero">
        <div className="hero-badge">🇧🇯 Arrondissement d'Avlékété · Commune de Ouidah</div>
        <h1>Répertoire Numérique de la<br/><span>Jeunesse d'Avlékété (RNJA)</span></h1>
        <p>Plateforme centralisée pour collecter, connecter et accompagner les jeunes de l'arrondissement vers l'emploi et les programmes de développement.</p>
        <div className="hero-btns">
          {!session&&<button className="btn-primary" onClick={()=>setPage('register')}>✦ S'inscrire maintenant</button>}
          {session?.role==='user'&&<button className="btn-primary" onClick={()=>setPage('profile')}>Mon profil</button>}
          {session?.role==='admin'&&<button className="btn-primary" onClick={()=>setPage('dashboard')}>Tableau de bord admin</button>}
          {!session&&<button className="btn-outline" onClick={()=>setPage('login')}>Se connecter</button>}
        </div>
      </div>
      <div className="page">
        <div className="stats-bar">
          <div className="stat-item"><div className="stat-num">{ok.length}</div><div className="stat-lbl">Jeunes inscrits</div></div>
          <div className="stat-divider"/>
          <div className="stat-item"><div className="stat-num">{VILLAGES_DEF.length}</div><div className="stat-lbl">Villages couverts</div></div>
          <div className="stat-divider"/>
          <div className="stat-item"><div className="stat-num">{ok.filter(u=>u.sexe==='Masculin').length}</div><div className="stat-lbl">Jeunes hommes</div></div>
          <div className="stat-divider"/>
          <div className="stat-item"><div className="stat-num">{ok.filter(u=>u.sexe==='Féminin').length}</div><div className="stat-lbl">Jeunes femmes</div></div>
          <div className="stat-divider"/>
          <div className="stat-item"><div className="stat-num">{ok.filter(u=>['Emploi salarié','Emploi indépendant'].includes(u.situation)).length}</div><div className="stat-lbl">En emploi</div></div>
        </div>
        <div className="section">
          <div className="section-title">Dernières inscriptions</div>
          <div className="section-sub">Jeunes récemment inscrits dans le répertoire</div>
          {ok.length===0
            ?<div className="empty-state"><div className="empty-icon">👥</div><div className="empty-title">Aucun profil pour l'instant</div><div className="empty-sub">Soyez le premier à vous inscrire !</div></div>
            :<div className="grid-3">{ok.slice(0,6).map(u=><MiniCard key={u.id} user={u}/>)}</div>}
        </div>
        <div style={{background:'linear-gradient(135deg,#1a3d2b,#2d6a4f)',borderRadius:20,padding:40,textAlign:'center',marginBottom:48}}>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:'1.5rem',color:'white',marginBottom:12}}>Vous êtes jeune d'Avlékété ?</div>
          <p style={{color:'rgba(255,255,255,0.7)',marginBottom:24,fontSize:15,maxWidth:480,margin:'0 auto 24px'}}>Rejoignez le répertoire pour être visible auprès des employeurs et des programmes de développement.</p>
          {!session&&<button className="btn-primary" onClick={()=>setPage('register')} style={{cursor:'pointer'}}>Créer mon profil gratuitement →</button>}
        </div>
      </div>
    </div>
  );
}

          <div>Métier : <span>{user.profession||'—'}</span></div>

}

/* ═══════════════════ LOGIN PAGE ═══════════════════ */
function LoginPage({login,setPage,toast,forceAdmin}){
  const [role,    setRole]    = useState(forceAdmin?'admin':'user');
  const [id,      setId]      = useState('');
  const [pwd,     setPwd]     = useState('');
  const [loading, setLoading] = useState(false);
  const [err,     setErr]     = useState('');
  const [showP,   setShowP]   = useState(false);

  const doLogin = async()=>{
    if(!id.trim()||!pwd){setErr('Veuillez remplir tous les champs.');return;}
    setErr('');setLoading(true);
    try{
      const ok=await login(id.trim(),pwd,role);
      if(ok===true){toast('Bienvenue ! Connexion réussie.','success');setPage(role==='admin'?'dashboard':'profile');}
      else if(ok==='pending'){setErr('Votre inscription est en attente de validation par un responsable.');}
      else{setErr(role==='admin'?'Identifiants administrateur incorrects.':'CIP ou mot de passe invalide.');}
    }catch{setErr('Erreur réseau — réessayez.');}
    setLoading(false);
  };

  return(
    <div className="login-page">
      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-circle">A</div>
          <div className="login-title">Connexion</div>
          <div className="login-sub">Répertoire de la Jeunesse d'Avlékété</div>
        </div>
        {!forceAdmin&&(
          <div className="role-tabs">
            {[['user','👤','Jeune'],['admin','🛡️','Administrateur']].map(([r,ic,lb])=>(
              <div key={r} className={`role-tab ${role===r?'active':''}`} onClick={()=>{setRole(r);setErr('');setId('');setPwd('');}} style={{cursor:'pointer'}}>
                <div className="role-tab-icon">{ic}</div>{lb}
              </div>
            ))}
          </div>
        )}
        {role==='admin'&&<div className="admin-lock">🔒 Accès réservé aux responsables autorisés uniquement.</div>}
        <div className="form-group">
          <label className="form-label">{role==='admin'?'Identifiant administrateur':'Numéro CIP'}</label>
          <input className="form-input" value={id} onChange={e=>setId(e.target.value)} placeholder={role==='admin'?'Ex : admin':'Ex : CIP001234'} autoComplete="username" onKeyDown={e=>e.key==='Enter'&&doLogin()} style={{cursor:'text'}}/>
        </div>
        <div className="form-group">
          <label className="form-label">Mot de passe</label>
          <div style={{position:'relative'}}>
            <input className="form-input" type={showP?'text':'password'} value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" autoComplete="current-password" onKeyDown={e=>e.key==='Enter'&&doLogin()} style={{cursor:'text'}}/>
            <span style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',cursor:'pointer',fontSize:16,userSelect:'none'}} onClick={()=>setShowP(s=>!s)}>{showP?'🙈':'👁'}</span>
          </div>
        </div>
        {err&&<div style={{background:'#fee2e2',color:'#991b1b',padding:'10px 14px',borderRadius:8,fontSize:13,marginBottom:16}}>{err}</div>}
        <button className="btn btn-green" style={{width:'100%',justifyContent:'center',cursor:'pointer'}} onClick={doLogin} disabled={loading}>
          {loading?<div className="spinner"></div>:'🔐 Se connecter'}
        </button>
        {!forceAdmin&&role==='user'&&(
          <div style={{marginTop:20,textAlign:'center',fontSize:13,color:'var(--text-light)'}}>
            Pas encore inscrit ?{' '}
            <span style={{color:'var(--green-mid)',fontWeight:600,cursor:'pointer',textDecoration:'underline'}} onClick={()=>setPage('register')}>Créer un compte</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════ REGISTER PAGE ═══════════════════ */
function RegisterPage({users,doAddUser,villages,setPage,toast}){
  const [step,  setStep]  = useState(1);
  const [form,  setForm]  = useState({nom:'',prenom:'',sexe:'',dob:'',cip:'',tel:'',email:'',niveau:'',diplomes:'',competences:'',situation:'',profession:'',village:'',biographie:'',password:'',confirmPwd:''});
  const [errs,  setErrs]  = useState({});
  const [load,  setLoad]  = useState(false);
  const [files, setFiles] = useState([]);
  const fileRef = useRef();

  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const fe=k=>errs[k]?<div className="form-error">{errs[k]}</div>:null;
  const fc=k=>`form-input${errs[k]?' error':''}`;
  const sc=k=>`form-select${errs[k]?' error':''}`;

  const v1=()=>{
    const e={};
    if(!form.nom.trim())    e.nom   ='Nom requis';
    if(!form.prenom.trim()) e.prenom='Prénom requis';
    if(!form.sexe)          e.sexe  ='Sexe requis';
    if(!form.dob)           e.dob   ='Date de naissance requise';
    else{const a=getAge(form.dob);if(a<15)e.dob='Minimum 15 ans';if(a>35)e.dob='Maximum 35 ans';}
    if(!form.cip.trim())    e.cip   ='Numéro CIP requis';
    else if(users.find(u=>u.cip===form.cip.trim())) e.cip='Ce CIP est déjà enregistré';
    if(!form.tel.trim())    e.tel   ='Téléphone requis';
    else if(!/^\d{10}$/.test(form.tel.trim())) e.tel='10 chiffres requis';
    setErrs(e);return!Object.keys(e).length;
  };
  const v2=()=>{
    const e={};
    if(!form.niveau)     e.niveau    ='Niveau requis';
    if(!form.situation)  e.situation ='Situation requise';
    if(!form.profession) e.profession='Profession requise';
    if(!form.village)    e.village   ='Village requis';
    setErrs(e);return!Object.keys(e).length;
  };
  const v3=()=>{
    const e={};
    if(!form.password)                    e.password='Mot de passe requis';
    else if(form.password.length<8)       e.password='Au moins 8 caractères';
    else if(!/[A-Z]/.test(form.password)) e.password='Au moins une majuscule';
    else if(!/[0-9]/.test(form.password)) e.password='Au moins un chiffre';
    if(form.password!==form.confirmPwd)   e.confirmPwd='Les mots de passe ne correspondent pas';
    setErrs(e);return!Object.keys(e).length;
  };

  const next=()=>{if(step===1&&v1())setStep(2);else if(step===2&&v2())setStep(3);};
  const [done, setDone] = useState(false);

  /* Permet de cliquer directement sur une étape : retour libre, avancée validée pas à pas */
  const goToStep=(target)=>{
    if(target===step)return;
    if(target<step){setStep(target);return;}
    if(step===1){
      if(!v1())return;
      if(target===2){setStep(2);return;}
      if(!v2())return;
      setStep(3);
    }else if(step===2){
      if(!v2())return;
      setStep(target);
    }
  };

  const handleFiles=async e=>{
    const fArr=Array.from(e.target.files);
    const ok=fArr.filter(f=>['application/pdf','image/jpeg','image/png','image/jpg'].includes(f.type)&&f.size<600*1024);
    if(ok.length<fArr.length)toast('Fichiers > 600 Ko ou format non autorisé ignorés','error');
    const uploaded=await Promise.all(ok.map(async f=>({name:f.name,size:f.size,type:f.type,data:await fileToB64(f),uploadedAt:new Date().toISOString()})));
    setFiles(p=>[...p,...uploaded].slice(0,5));
  };

  const submit=async()=>{
    if(!v3())return;
    setLoad(true);
    try{
      const j=await DB.addJeune({nom:form.nom.trim(),prenom:form.prenom.trim(),sexe:form.sexe,dob:form.dob,cip:form.cip.trim(),tel:form.tel.trim(),email:form.email.trim()||null,niveau:form.niveau,situation:form.situation,profession:form.profession,village:form.village,competences:form.competences||null,diplomes:form.diplomes||null,biographie:form.biographie||null,status:'pending',files});
      await DB.addAccount({cip:form.cip.trim(),password_hash:await hashPwd(form.password),user_id:j.id});
      await DB.log(`Nouvelle inscription : ${form.prenom} ${form.nom} (${form.village})`,'register');
      doAddUser(j);
      toast('✓ Compte créé avec succès !','success');
      setDone(true);
    }catch(e){toast('Erreur : '+e.message,'error');}
    setLoad(false);
  };

  const STEPS=['Identité','Parcours','Documents & Sécurité'];

  if(done)return(
    <div className="page" style={{maxWidth:560,paddingTop:80,paddingBottom:80,textAlign:'center'}}>
      <div style={{fontSize:64,marginBottom:20}}>✅</div>
      <div className="section-title" style={{marginBottom:10}}>Compte créé avec succès !</div>
      <p style={{color:'var(--text-light)',fontSize:15,lineHeight:1.8,marginBottom:8}}>
        Bienvenue, <strong>{form.prenom} {form.nom}</strong>. Votre inscription au Répertoire Numérique de la Jeunesse d'Avlékété a bien été enregistrée.
      </p>
      <p style={{color:'var(--text-light)',fontSize:15,lineHeight:1.8,marginBottom:32}}>
        Un responsable doit maintenant valider votre dossier avant votre premier accès. Vous pourrez alors vous connecter avec votre numéro CIP et votre mot de passe.
      </p>
      <button className="btn-primary" style={{cursor:'pointer'}} onClick={()=>setPage('login')}>Aller à la connexion →</button>
    </div>
  );

  return(
    <div className="page" style={{maxWidth:720,paddingTop:40,paddingBottom:60}}>
      <div style={{marginBottom:28}}>
        <div className="section-title">Inscription au Répertoire</div>
        <div className="section-sub">Arrondissement d'Avlékété · Commune de Ouidah · Bénin</div>
      </div>
      <div style={{background:'rgba(30,96,145,0.07)',border:'1px solid rgba(30,96,145,0.18)',borderRadius:10,padding:'12px 16px',marginBottom:24,fontSize:13,color:'#1e6091',display:'flex',gap:10,alignItems:'center'}}>
        <span>ℹ️</span><span>Votre inscription sera vérifiée et activée par un responsable avant votre premier accès.</span>
      </div>
      <div className="steps">
        {STEPS.map((s,i)=>(
          <div key={s} className={`step ${step===i+1?'active':step>i+1?'done':''}`} onClick={()=>goToStep(i+1)} title={`Aller à l'étape : ${s}`}>
            <div className="step-circle">{step>i+1?'✓':i+1}</div>
            <div className="step-label">{s}</div>
          </div>
        ))}
      </div>
      <div className="card">
        {step===1&&(
          <>
            <div className="form-section-title">Informations personnelles</div>
            <div className="grid-2">
              <div className="form-group"><label className="form-label">Nom <span>*</span></label><input className={fc('nom')} value={form.nom} onChange={e=>set('nom',e.target.value)} placeholder="AHOUANDJINOU"/>{fe('nom')}</div>
              <div className="form-group"><label className="form-label">Prénom <span>*</span></label><input className={fc('prenom')} value={form.prenom} onChange={e=>set('prenom',e.target.value)} placeholder="Kofi"/>{fe('prenom')}</div>
            </div>
            <div className="grid-2">
              <div className="form-group">
                <label className="form-label">Sexe <span>*</span></label>
                <select className={sc('sexe')} value={form.sexe} onChange={e=>set('sexe',e.target.value)} style={{cursor:'pointer'}}>
                  <option value="">-- Sélectionner --</option><option>Masculin</option><option>Féminin</option>
                </select>{fe('sexe')}
              </div>
              <div className="form-group">
                <label className="form-label">Date de naissance <span>*</span></label>
                {(()=>{
                  const [dY,dM,dD]=form.dob?form.dob.split('-'):['','',''];
                  const curY=new Date().getFullYear();
                  const pad=n=>String(n).padStart(2,'0');
                  const updateDob=(y,m,d)=>set('dob',(y&&m&&d)?`${y}-${m}-${d}`:'');
                  const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
                  return(
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1.4fr 1fr',gap:8}}>
                      <select className={sc('dob')} value={dD} onChange={e=>updateDob(dY,dM,e.target.value)} style={{cursor:'pointer'}}>
                        <option value="">Jour</option>
                        {Array.from({length:31},(_,i)=>pad(i+1)).map(d=><option key={d} value={d}>{d}</option>)}
                      </select>
                      <select className={sc('dob')} value={dM} onChange={e=>updateDob(dY,e.target.value,dD)} style={{cursor:'pointer'}}>
                        <option value="">Mois</option>
                        {MOIS.map((m,i)=><option key={m} value={pad(i+1)}>{m}</option>)}
                      </select>
                      <select className={sc('dob')} value={dY} onChange={e=>updateDob(e.target.value,dM,dD)} style={{cursor:'pointer'}}>
                        <option value="">Année</option>
                        {Array.from({length:60},(_,i)=>String(curY-14-i)).map(y=><option key={y} value={y}>{y}</option>)}
                      </select>
                    </div>
                  );
                })()}
                {fe('dob')}<div className="form-hint">Réservé aux 15 – 35 ans</div>
              </div>
            </div>
            <div className="grid-2">
              <div className="form-group"><label className="form-label">Numéro CIP <span>*</span></label><input className={fc('cip')} value={form.cip} onChange={e=>set('cip',e.target.value)} placeholder="CIP123456"/>{fe('cip')}<div className="form-hint">Carte d'Identité Professionnelle</div></div>
              <div className="form-group"><label className="form-label">Téléphone WhatsApp <span>*</span></label><input className={fc('tel')} value={form.tel} onChange={e=>set('tel',e.target.value)} placeholder="0197123456" maxLength={10}/>{fe('tel')}<div className="form-hint">10 chiffres — numéro WhatsApp actif</div></div>
            </div>
            <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="exemple@email.com (optionnel)"/></div>
          </>
        )}
        {step===2&&(
          <>
            <div className="form-section-title">Parcours & Localisation</div>
            <div className="grid-2">
              <div className="form-group"><label className="form-label">Niveau d'étude <span>*</span></label><select className={sc('niveau')} value={form.niveau} onChange={e=>set('niveau',e.target.value)} style={{cursor:'pointer'}}><option value="">-- Sélectionner --</option>{NIVEAUX.map(n=><option key={n}>{n}</option>)}</select>{fe('niveau')}</div>
              <div className="form-group"><label className="form-label">Situation professionnelle <span>*</span></label><select className={sc('situation')} value={form.situation} onChange={e=>set('situation',e.target.value)} style={{cursor:'pointer'}}><option value="">-- Sélectionner --</option>{SITUATIONS.map(s=><option key={s}>{s}</option>)}</select>{fe('situation')}</div>
            </div>
            <div className="grid-2">
              <div className="form-group"><label className="form-label">Domaine / Profession <span>*</span></label><select className={sc('profession')} value={form.profession} onChange={e=>set('profession',e.target.value)} style={{cursor:'pointer'}}><option value="">-- Sélectionner --</option>{PROFESSIONS.map(p=><option key={p}>{p}</option>)}</select>{fe('profession')}</div>
              <div className="form-group"><label className="form-label">Village / Quartier <span>*</span></label><select className={sc('village')} value={form.village} onChange={e=>set('village',e.target.value)} style={{cursor:'pointer'}}><option value="">-- Sélectionner --</option>{villages.map(v=><option key={v}>{v}</option>)}</select>{fe('village')}</div>
            </div>
            <div className="form-group"><label className="form-label">Diplômes obtenus</label><textarea className="form-textarea" value={form.diplomes} onChange={e=>set('diplomes',e.target.value)} placeholder="Ex : Licence en Informatique – UAC 2021"/></div>
            <div className="form-group"><label className="form-label">Compétences</label><input className="form-input" value={form.competences} onChange={e=>set('competences',e.target.value)} placeholder="Ex : Informatique, Couture, Gestion (séparées par des virgules)"/></div>
            <div className="form-group"><label className="form-label">Biographie courte</label><textarea className="form-textarea" value={form.biographie} onChange={e=>set('biographie',e.target.value)} placeholder="Présentez-vous en quelques lignes…"/></div>
          </>
        )}
        {step===3&&(
          <>
            <div className="form-section-title">Documents & Mot de passe</div>
            <div className="form-group">
              <label className="form-label">Pièces justificatives (optionnel)</label>
              <div className="upload-zone" onClick={()=>fileRef.current?.click()} style={{cursor:'pointer'}}>
                <div className="upload-icon">📎</div>
                <div className="upload-text">Cliquez pour ajouter des documents</div>
                <div className="upload-sub">PDF, JPG, PNG · Max 600 Ko · 5 fichiers maximum</div>
              </div>
              <input ref={fileRef} type="file" multiple accept=".pdf,.jpg,.jpeg,.png" style={{display:'none'}} onChange={handleFiles}/>
              {files.length>0&&(
                <div style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:8}}>
                  {files.map((f,i)=>(
                    <span key={i} className="file-chip">
                      📄 {f.name}
                      <span className="file-chip-x" onClick={()=>setFiles(p=>p.filter((_,j)=>j!==i))} style={{cursor:'pointer'}}>×</span>
                    </span>
                  ))}
                </div>
              )}
            </div>
            <div className="form-group">
              <label className="form-label">Mot de passe <span>*</span></label>
              <input className={fc('password')} type="password" value={form.password} onChange={e=>set('password',e.target.value)} placeholder="Min. 8 caractères, 1 majuscule, 1 chiffre"/>{fe('password')}
            </div>
            <div className="form-group">
              <label className="form-label">Confirmer le mot de passe <span>*</span></label>
              <input className={fc('confirmPwd')} type="password" value={form.confirmPwd} onChange={e=>set('confirmPwd',e.target.value)} placeholder="Répétez le mot de passe"/>{fe('confirmPwd')}
            </div>
            <div style={{background:'var(--cream)',padding:16,borderRadius:10,fontSize:13,lineHeight:2,marginBottom:8}}>
              <strong>Récapitulatif :</strong><br/>
              👤 {form.prenom} {form.nom} · {form.sexe}{form.dob?` · ${getAge(form.dob)} ans`:''}<br/>
              📍 {form.village} · 🎓 {form.niveau}<br/>
              💼 {form.profession} · {form.situation}
            </div>
          </>
        )}
        <div style={{display:'flex',gap:12,justifyContent:'space-between',marginTop:28,flexWrap:'wrap'}}>
          {step>1&&<button className="btn btn-ghost-green" onClick={()=>setStep(s=>s-1)} style={{cursor:'pointer'}}>← Précédent</button>}
          {step<3
            ?<button className="btn btn-green" style={{marginLeft:'auto',cursor:'pointer'}} onClick={next}>Suivant →</button>
            :<button className="btn btn-gold" style={{marginLeft:'auto',cursor:'pointer'}} onClick={submit} disabled={load}>
              {load?<><div className="spinner dark"></div> Envoi…</>:'✓ Soumettre mon inscription'}
            </button>}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════ PROFILE PAGE ═══════════════════ */
function ProfilePage({user,doSaveUser,villages,setPage,toast,messages,doAddMsg,doReadMsgs}){
  const [editing,  setEditing]  = useState(false);
  const [form,     setForm]     = useState({...user});
  const [tab,      setTab]      = useState('info');
  const [saving,   setSaving]   = useState(false);

  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const age=getAge(user.dob);
  const myMsgs=messages.filter(m=>m.toUserId===user.id);
  const unread=myMsgs.filter(m=>!m.readByUser).length;

  const save=async()=>{
    setSaving(true);
    try{
      await doSaveUser(user.id,{nom:form.nom,prenom:form.prenom,tel:form.tel,email:form.email,niveau:form.niveau,situation:form.situation,profession:form.profession,village:form.village,competences:form.competences,diplomes:form.diplomes,biographie:form.biographie});
      setEditing(false);toast('Profil mis à jour !','success');
    }catch(e){toast('Erreur : '+e.message,'error');}
    setSaving(false);
  };

  const onSend=async text=>{
    await doAddMsg({to_user_id:user.id,text,from_role:'user',read_by_admin:false,read_by_user:true});
  };

  useEffect(()=>{
    if(tab==='msgs'){
      const ids=myMsgs.filter(m=>!m.readByUser&&m.from==='admin').map(m=>m.id);
      if(ids.length)doReadMsgs(ids,'read_by_user');
    }
  },[tab]);

  if(user.status==='pending')return(
    <div className="page" style={{paddingTop:80,paddingBottom:60,textAlign:'center',maxWidth:500}}>

/* ═══════════════════ MY MESSAGES ═══════════════════ */
function MyMessagesPage({user,messages,doAddMsg,doReadMsgs,toast}){
  const myMsgs=messages.filter(m=>m.toUserId===user.id);
  useEffect(()=>{
    const ids=myMsgs.filter(m=>!m.readByUser&&m.from==='admin').map(m=>m.id);
    if(ids.length)doReadMsgs(ids,'read_by_user');
  },[]);
  const onSend=async text=>{await doAddMsg({to_user_id:user.id,text,from_role:'user',read_by_admin:false,read_by_user:true});};
  return(
    <div className="page" style={{paddingTop:40,paddingBottom:60,maxWidth:720}}>
      <div className="section-title" style={{marginBottom:8}}>Mes messages</div>
      <div className="section-sub" style={{marginBottom:24}}>Conversations avec les responsables</div>
      <ChatBox messages={myMsgs} onSend={onSend} isAdmin={false} toast={toast}/>
    </div>
  );
}

/* ═══════════════════ CHAT BOX ═══════════════════ */
function ChatBox({messages,onSend,isAdmin,toast}){
  const [input,   setInput]   = useState('');
  const [sending, setSending] = useState(false);
  const bottomRef = useRef();
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);
  const send=async()=>{
    if(!input.trim()||sending)return;
    setSending(true);
    try{await onSend(input.trim());setInput('');}
    catch(e){console.error(e);toast?.('Message non envoyé : '+(e.message||'erreur réseau. Réessayez.'),'error');}
    setSending(false);
  };
  return(
    <div className="chat-container">
      <div className="chat-messages">
        {messages.length===0&&<div style={{textAlign:'center',color:'var(--text-light)',fontSize:13,margin:'auto'}}>Aucun message pour l'instant</div>}
        {messages.map(m=>(
          <div key={m.id} className={`chat-bubble ${m.from==='admin'?(isAdmin?'sent':'received'):(isAdmin?'received':'sent')}`}>
            {m.text}
            <div className="chat-bubble-meta">{new Date(m.at).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        ))}
        <div ref={bottomRef}/>
      </div>
      <div className="chat-input-row">
        <input className="chat-input" value={input} onChange={e=>setInput(e.target.value)} placeholder="Écrire un message…" onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()}/>
        <button className="btn btn-green btn-sm" onClick={send} disabled={sending} style={{cursor:'pointer'}}>{sending?<div className="spinner" style={{width:14,height:14,borderWidth:2}}></div>:'Envoyer'}</button>
      </div>
    </div>
  );
}

  const exportCSV=()=>{
    const h=['Nom','Prénom','Sexe','D.naiss','CIP','Tel','Email','Niveau','Situation','Profession','Village','Diplômes','Compétences','Statut','Inscription'];
    const rows=filtered.map(u=>[u.nom,u.prenom,u.sexe,u.dob,u.cip,u.tel,u.email,u.niveau,u.situation,u.profession,u.village,u.diplomes,u.competences,u.status,u.createdAt]);
    const csv=[h,...rows].map(r=>r.map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download='repertoire-avlekete.csv';a.click();

  };

  const sendMsg=async text=>{

  const TABS=[['overview','📊 Vue d\'ensemble'],['pending',`⏳ En attente${pnd.length>0?' ('+pnd.length+')':''}`],['liste','📋 Membres'],['messages',`💬 Messages${uAdm>0?' ('+uAdm+')':''}`],['villages','🏘️ Villages'],['activity','📜 Journal'],...(isPrincipal?[['admins','🛡️ Administrateurs']]:[])];

  const allAdminUsernames=[...ADMINS.map(a=>a.username),...dbAdmins.map(a=>a.username)];

    const e={};

    if(!newAdm.username.trim())e.username='Identifiant requis';
    else if(allAdminUsernames.includes(newAdm.username.trim())) e.username='Cet identifiant existe déjà';

    else if(newAdm.password.length<8)           e.password='Au moins 8 caractères';

    else if(!/[0-9]/.test(newAdm.password))     e.password='Au moins un chiffre';

      )}
    </div>
  );
}

/* ═══════════════════ GRAPHIQUES ═══════════════════ */
function DonutChart({data}){
  const ref=useRef();const cRef=useRef();
  useEffect(()=>{
    if(!ref.current)return;
    if(cRef.current)cRef.current.destroy();
    const total=data.reduce((s,d)=>s+d.value,0);
    cRef.current=new Chart(ref.current,{type:'doughnut',data:{labels:data.map(d=>`${d.label} (${d.value})`),datasets:[{data:data.map(d=>d.value),backgroundColor:data.map(d=>d.color||'#9ca3af'),borderWidth:2,borderColor:'#fff',hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{family:'DM Sans',size:12},padding:12}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${total?Math.round(ctx.parsed/total*100):0}%`}}}}});
    return()=>cRef.current?.destroy();
  },[data]);
  return <canvas ref={ref} style={{maxHeight:220}}/>;
}

function BarChart({data,color='#2d6a4f'}){
  const ref=useRef();const cRef=useRef();
  useEffect(()=>{
    if(!ref.current)return;
    if(cRef.current)cRef.current.destroy();
    cRef.current=new Chart(ref.current,{type:'bar',data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.value),backgroundColor:color+'cc',borderColor:color,borderWidth:1.5,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{family:'DM Sans',size:11}},grid:{color:'#f3f4f6'}},x:{ticks:{font:{family:'DM Sans',size:10},maxRotation:45},grid:{display:false}}}}});
    return()=>cRef.current?.destroy();
  },[data,color]);
  return <canvas ref={ref} style={{maxHeight:210}}/>;
}

/* ═══════════════════ FILET DE SÉCURITÉ ═══════════════════ */
/* Sans ceci, la moindre erreur non prévue pendant l'affichage fait
   disparaître toute l'application (écran blanc). Avec, l'utilisateur
   voit un message clair et peut recharger sans tout perdre. */
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null,info:null};}
  static getDerivedStateFromError(error){return{error};}
  componentDidCatch(error,info){console.error('Erreur applicative :',error,info);this.setState({info});}
  render(){
    if(this.state.error){
      return(
        <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,padding:32,textAlign:'center',fontFamily:'Inter,sans-serif',background:'#f7f3ec'}}>
          <div style={{fontSize:48}}>⚠️</div>
          <div style={{fontSize:20,fontWeight:700,color:'#1a3d2b'}}>Une erreur est survenue</div>
          <div style={{fontSize:14,color:'#666',maxWidth:480}}>Désolé, quelque chose s'est mal passé. Vos données n'ont pas été perdues — essayez de recharger la page.</div>
          <div style={{fontSize:11,color:'#999',maxWidth:600,fontFamily:'monospace',wordBreak:'break-word',whiteSpace:'pre-wrap',textAlign:'left',background:'#fff',border:'1px solid #eee',borderRadius:8,padding:12,maxHeight:260,overflow:'auto'}}>
            {String(this.state.error?.stack||this.state.error?.message||this.state.error)}
            {this.state.info?.componentStack&&('\n\n--- Composants ---'+this.state.info.componentStack)}
          </div>
          <button className="btn-primary" style={{cursor:'pointer'}} onClick={()=>window.location.reload()}>Recharger la page</button>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><Root/></ErrorBoundary>);
</script>
